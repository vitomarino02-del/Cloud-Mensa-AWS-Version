# Cluster Kubernetes (kubeadm) sulle istanze EC2 create da Terraform.
# Stesso playbook della Fase 1, con due differenze dovute ad AWS:
#  - l'API server pubblicizza l'IP privato ma il certificato include anche
#    quello pubblico, per poter usare kubectl dal PC
#  - il kubeconfig scaricato viene riscritto con l'IP pubblico
# Uso: ansible-playbook -i inventory.ini site.yml

- name: Prerequisiti comuni a tutti i nodi
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Disattiva la swap
      command: swapoff -a
      changed_when: false

    - name: Moduli kernel per container e rete bridge
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Carica subito i moduli
      command: modprobe {{ item }}
      loop: [overlay, br_netfilter]
      changed_when: false

    - name: Parametri di rete richiesti da Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
      notify: applica sysctl

    - name: Installa containerd
      apt:
        name: containerd
        state: present
        update_cache: true

    - name: Configura containerd con cgroup systemd
      shell: |
        mkdir -p /etc/containerd
        containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml
      notify: riavvia containerd

    - name: Chiave APT del repository Kubernetes
      shell: |
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Repository Kubernetes
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
        state: present

    - name: Installa kubelet, kubeadm e kubectl
      apt:
        name: [kubelet, kubeadm, kubectl]
        state: present
        update_cache: true

    - name: Blocca gli aggiornamenti automatici dei pacchetti K8s
      command: apt-mark hold kubelet kubeadm kubectl
      changed_when: false

    # serve al control plane per rigenerare il token ECR durante il deploy
    # automatico lanciato da GitHub Actions via SSM
    - name: Installa la AWS CLI
      snap:
        name: aws-cli
        classic: true

  handlers:
    - name: applica sysctl
      command: sysctl --system

    - name: riavvia containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true

- name: Inizializza il control plane
  hosts: control_plane
  become: true
  tasks:
    # advertise-address: IP privato (comunicazione interna al cluster)
    # cert-extra-sans: IP pubblico (per usare kubectl dal PC)
    - name: kubeadm init
      command: >
        kubeadm init
        --pod-network-cidr=10.244.0.0/16
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
        --apiserver-cert-extra-sans={{ ansible_host }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: kubeconfig per l'utente ubuntu
      shell: |
        mkdir -p /home/ubuntu/.kube
        cp /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
        chown -R ubuntu:ubuntu /home/ubuntu/.kube
      args:
        creates: /home/ubuntu/.kube/config

    - name: Installa la rete dei pod (Flannel)
      command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Genera il comando di join per i worker
      command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false

    - name: Scarica il kubeconfig sul PC
      fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/kubeconfig"
        flat: true

- name: Unisci i worker al cluster
  hosts: workers
  become: true
  tasks:
    - name: kubeadm join
      command: "{{ hostvars[groups['control_plane'][0]].join_cmd.stdout }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Prepara il kubeconfig locale
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # Nel file scaricato l'API server e' l'IP privato: da fuori non e'
    # raggiungibile, quindi va sostituito con quello pubblico.
    - name: Punta il kubeconfig all'IP pubblico del control plane
      replace:
        path: "{{ playbook_dir }}/kubeconfig"
        regexp: 'server: https://.*:6443'
        replace: "server: https://{{ hostvars[groups['control_plane'][0]].ansible_host }}:6443"
