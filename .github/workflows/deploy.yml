# Pipeline dell'applicazione (Fase 2) - GitHub Actions.
# Come deploy.yml del laboratorio: il kubeconfig si legge da SSM e kubectl
# gira sul runner. In piu', essendo immagini nostre, prima si costruiscono
# e si pubblicano su ECR con tag = SHA del commit.
# Parte quando cambiano i manifest o il codice dei servizi (o a mano).
name: Deploy to Kubernetes

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'menu-service/**'
      - 'order-service/**'
      - 'kitchen-service/**'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC
  contents: read

env:
  AWS_REGION: eu-central-1
  PROJECT: mensa
  TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # nessuna chiave AWS: il token OIDC diventa credenziali temporanee
      - name: Credenziali AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Installa kubectl
        uses: azure/setup-kubectl@v4

      - name: Leggi il KUBECONFIG da SSM Parameter Store
        run: |
          aws ssm get-parameter \
            --name "/mensa/kubeconfig" \
            --with-decryption \
            --query Parameter.Value \
            --output text > kubeconfig
          chmod 600 kubeconfig

      - name: Verifica che il cluster risponda
        run: KUBECONFIG=./kubeconfig kubectl get nodes

      - name: Login su ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push delle immagini
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for s in menu-service order-service kitchen-service frontend; do
            docker build -t $REGISTRY/$PROJECT/$s:$TAG ./$s
            docker push $REGISTRY/$PROJECT/$s:$TAG
          done

      # il token per scaricare da ECR dura 12 ore: lo si rinnova a ogni deploy
      - name: Rinnova il secret ecr-creds
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          KUBECONFIG=./kubeconfig kubectl -n mensa create secret docker-registry ecr-creds \
            --docker-server=$REGISTRY \
            --docker-username=AWS \
            --docker-password="$(aws ecr get-login-password --region $AWS_REGION)" \
            --dry-run=client -o yaml | KUBECONFIG=./kubeconfig kubectl apply -f -

      # nei manifest il tag e' 1.0 (usato da up.sh): qui diventa lo SHA
      - name: Applica i manifest
        run: |
          sed -i -E "s#(image: .*/mensa/(menu-service|order-service|kitchen-service|frontend)):.*#\1:$TAG#" k8s/*.yaml
          grep -h "image:" k8s/*.yaml
          KUBECONFIG=./kubeconfig kubectl apply -f k8s/

      - name: Attendi il rollout
        run: |
          for d in menu-service order-service kitchen-service frontend; do
            KUBECONFIG=./kubeconfig kubectl -n mensa rollout status deployment/$d --timeout=180s
          done

      - name: Pod in esecuzione
        run: KUBECONFIG=./kubeconfig kubectl -n mensa get pods -o wide
