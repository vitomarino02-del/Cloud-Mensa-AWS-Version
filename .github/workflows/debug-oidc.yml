# Diagnostica OIDC: mostra i claim "sub" e "aud" del token che GitHub presenta
# ad AWS, per confrontarli con la trust policy del ruolo. Non stampa il token.
# Da togliere quando l'autenticazione funziona.
name: Debug OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # token di un job normale (come il job "plan")
  senza-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Claim del token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="$PAYLOAD="; done
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, ref}'

  # token di un job con environment (come "provision" e "destroy")
  con-environment:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Claim del token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="$PAYLOAD="; done
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, environment}'
