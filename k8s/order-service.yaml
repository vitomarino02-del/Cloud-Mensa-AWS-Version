# order-service: 2 repliche. Usa RDS, ElastiCache e Amazon MQ (endpoint nel Secret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: mensa
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      imagePullSecrets:
        - name: ecr-creds
      containers:
        - name: order-service
          image: 862087104689.dkr.ecr.eu-central-1.amazonaws.com/mensa/order-service:1.0
          envFrom:
            - configMapRef: { name: mensa-config }
            - secretRef: { name: mensa-secrets }
          ports:
            - containerPort: 5002
          readinessProbe:
            httpGet: { path: /healthz, port: 5002 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: mensa
spec:
  selector: { app: order-service }
  ports:
    - port: 5002
