# menu-service: catalogo piatti. Immagine da ECR, foto su S3.
# Le credenziali AWS non sono nel pod: boto3 usa il ruolo IAM dell'istanza EC2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-service
  namespace: mensa
spec:
  replicas: 1
  selector:
    matchLabels: { app: menu-service }
  template:
    metadata:
      labels: { app: menu-service }
    spec:
      imagePullSecrets:
        - name: ecr-creds
      containers:
        - name: menu-service
          image: 862087104689.dkr.ecr.eu-central-1.amazonaws.com/mensa/menu-service:1.0
          envFrom:
            - configMapRef: { name: mensa-config }
            - secretRef: { name: mensa-secrets }
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet: { path: /healthz, port: 5001 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: menu-service
  namespace: mensa
spec:
  selector: { app: menu-service }
  ports:
    - port: 5001
