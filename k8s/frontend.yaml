# frontend: Nginx + SPA. NodePort 30080, la porta a cui punta il target group
# del Network Load Balancer creato da Terraform
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mensa
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      imagePullSecrets:
        - name: ecr-creds
      containers:
        - name: frontend
          image: 862087104689.dkr.ecr.eu-central-1.amazonaws.com/mensa/frontend:1.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mensa
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - port: 80
      nodePort: 30080
